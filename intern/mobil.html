<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a4b8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSO mobil">
<link rel="icon" href="https://hfmt-hso.github.io/icon-192.png">
<link rel="apple-touch-icon" href="https://hfmt-hso.github.io/icon-192.png">
<title>HSO mobil</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0f0f14;--ink3:#4a4a5e;--paper:#f7f6f2;--paper2:#eeece6;--blue:#1a4b8c;--blue-bg:#eef3fb;--green:#1e6b3a;--green-bg:#e8f4ed;--red:#9b2335;--red-bg:#fbeaed;--gold2:#8a6e1f;--gold-bg:#fdf8ee;--border:#dddad0;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#f1f0ec;--ink3:#b4b2aa;--paper:#15151a;--paper2:#1f1f26;--blue:#6ea3e8;--blue-bg:#1d2a40;--green:#6fcf97;--green-bg:#17301f;--red:#ff8a9a;--red-bg:#3a1a20;--gold2:#e0c068;--gold-bg:#2d2815;--border:#34343e}}
html{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:16px 2px 10px}
header img{width:30px;height:30px;border-radius:7px}
header h1{font-size:18px;font-weight:800;letter-spacing:.2px;flex:1}
header a,header button.lo{font-size:12px;color:var(--ink3);background:none;border:none;text-decoration:underline;cursor:pointer;font-family:inherit}
h2{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin:20px 2px 8px}
.cmd{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;font-family:inherit;color:var(--ink);font-size:16px;cursor:pointer;min-height:64px;-webkit-tap-highlight-color:transparent}
.cmd:active{transform:scale(.99)}
.cmd .ic{font-size:24px;width:34px;text-align:center;flex-shrink:0}
.cmd .tx{flex:1;min-width:0}
.cmd .tx b{display:block;font-size:15px;font-weight:700}
.cmd .tx small{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.cmd .st{font-size:12px;font-weight:700;flex-shrink:0;max-width:38%;text-align:right}
.cmd.run{border-color:var(--blue);background:var(--blue-bg)}
.cmd.run .st{color:var(--blue)}
.cmd.ok .st{color:var(--green)}
.cmd.err .st{color:var(--red)}
.cmd.off{opacity:.55;cursor:default}
.cmd.off .st{color:var(--gold2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.linkres{display:block;margin:-2px 0 10px;padding:12px 14px;border-radius:12px;background:var(--green-bg);color:var(--green);font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.panel{background:var(--paper2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.hw{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--paper)}
.hw label{font-size:12px;color:var(--ink3);display:block;margin:6px 0 3px}
.hw input[type=text],.hw input[type=date],.hw input[type=time],.hw textarea{width:100%;font-size:16px;font-family:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--paper2);color:var(--ink)}
.hw textarea{min-height:84px;resize:vertical}
.hw .row{display:flex;align-items:center;gap:10px;margin-top:8px;justify-content:space-between}
.btn{font-family:inherit;font-size:15px;font-weight:700;padding:11px 16px;border-radius:10px;border:1px solid var(--border);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.5}
#gate{padding-top:40px}
#gate input{width:100%;font-size:16px;font-family:inherit;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--paper2);color:var(--ink);margin-bottom:10px}
#gate .btn{width:100%}
#gate .e{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
.sel{width:100%;font-size:16px;font-family:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--paper2);color:var(--ink)}
.chkl{display:flex!important;gap:8px;align-items:center;font-size:13px!important;color:var(--ink)!important;margin-top:10px!important}
.plist{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:9px;background:var(--paper2)}
.plist button{display:block;width:100%;text-align:left;font-family:inherit;font-size:15px;padding:11px 12px;border:none;border-bottom:1px solid var(--border);background:none;color:var(--ink);cursor:pointer}
.plist button.on{background:var(--blue-bg);font-weight:700}
.plist small{color:var(--ink3)}
.semg{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:6px}
.semg label{display:flex;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--ink)}
.hw input[type=checkbox]{width:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph .x{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:none;color:var(--ink3);background:none;border:1px solid var(--border);border-radius:8px;padding:4px 9px;cursor:pointer}
.foot{font-size:11px;color:var(--ink3);text-align:center;margin-top:22px}
</style>
</head>
<body>

<!-- LOGIN (teilt sich die Anmeldung mit intern/index.html: gleiche localStorage-Schlüssel) -->
<div id="gate" style="display:none">
  <header style="padding-top:0"><img src="https://hfmt-hso.github.io/icon-192.png" alt=""><h1>HSO mobil</h1></header>
  <input id="u" type="text" placeholder="Nutzername / Matrikelnr." autocomplete="username" autocapitalize="off">
  <input id="p" type="password" placeholder="Passwort" autocomplete="current-password">
  <button class="btn pri" id="gbtn" onclick="login()">Anmelden</button>
  <div class="e" id="ge"></div>
</div>

<div id="app" style="display:none">
  <header>
    <img src="https://hfmt-hso.github.io/icon-192.png" alt="">
    <h1>HSO mobil</h1>
    <a href="index.html">Voll-Portal</a>
    <button class="lo" onclick="logout()">Abmelden</button>
  </header>
  <div id="liste"></div>

  <div id="bswrap" style="display:none">
    <h2 class="ph">Besetzung eintragen<button class="x" onclick="panelZu('bswrap')">▲ zuklappen</button></h2>
    <div class="hw">
      <label>Projekt</label><select id="bsp" class="sel"></select>
      <label class="chkl"><input type="checkbox" id="bsalt"> auch ältere Projekte</label>
      <label>Instrument</label><select id="bsi" class="sel"></select>
      <label>Name suchen</label><input type="text" id="bsq" placeholder="Name tippen …">
      <label>Personen <span id="bsz"></span></label>
      <div id="bsl" class="plist"></div>
    </div>
    <div class="hw" id="bskarte" style="display:none">
      <div id="bskn" style="font-weight:800;font-size:16px"></div>
      <div id="bski" style="font-size:12px;color:var(--ink3)"></div>
      <label>Status im Projekt</label><select id="bsst" class="sel"></select>
      <div id="bspw"><label>Position</label><input type="text" id="bspos" list="bsposl" autocomplete="off" placeholder="z. B. Vl. 1"><datalist id="bsposl"></datalist></div>
      <label class="chkl"><input type="checkbox" id="bsmail"> Bestätigung per E-Mail senden</label>
      <div id="bsmo" style="display:none"><label>Anrede</label><select id="bsan" class="sel"><option>Liebe</option><option>Lieber</option><option selected>Hallo</option></select></div>
      <div class="row"><button class="btn" onclick="bsPortal()">Im Portal anzeigen</button><button class="btn pri" id="bssave" onclick="bsSpeichern()">Speichern</button></div>
    </div>
  </div>

  <div id="tbwrap" style="display:none">
    <h2 class="ph">Teilnahmebestätigung<button class="x" onclick="panelZu('tbwrap')">▲ zuklappen</button></h2>
    <div class="hw">
      <label>Name suchen</label>
      <div style="display:flex;gap:6px"><input type="text" id="tbq" placeholder="Vor- oder Nachname"><button class="btn" onclick="tbSuchen()">Suchen</button></div>
      <div id="tbl" class="plist" style="margin-top:8px;display:none"></div>
      <div id="tbsel" style="margin-top:8px;font-weight:700"></div>
      <label class="chkl"><input type="checkbox" id="tbman"> Person nicht gefunden: manuell eingeben</label>
      <div id="tbmp" style="display:none">
        <label>Vorname</label><input type="text" id="tbvn"><label>Nachname</label><input type="text" id="tbnn"><label>E-Mail</label><input type="text" id="tbem">
      </div>
      <label class="chkl"><input type="checkbox" id="tbsm"> Semester manuell wählen (statt Anwesenheitsliste)</label>
      <div id="tbsemw" style="display:none"></div>
      <label>Weitere Projekte (eine Zeile pro Projekt)</label><textarea id="tbwp" placeholder="z. B. WiSe 20 Projekt XYZ"></textarea>
      <div class="row"><button class="btn" id="tbvab" onclick="tbVoranfrage()">1. Voranfrage</button><button class="btn pri" id="tbeb" onclick="tbErstellen()">2. Bescheinigung erstellen</button></div>
    </div>
    <div class="hw" id="tbva" style="display:none">
      <b>Voranfrage per Mail</b>
      <label>An</label><input type="text" id="vaem"><label>Betreff</label><input type="text" id="vabt">
      <label>Anrede</label><select id="vaan" class="sel" onchange="tbVaText()"><option>Liebe</option><option>Lieber</option><option selected>Hallo</option></select>
      <label>Text</label><textarea id="vatx" style="min-height:200px"></textarea>
      <div class="row"><span></span><button class="btn pri" id="vasend" onclick="tbVaSenden()">Voranfrage senden</button></div>
    </div>
    <div class="hw" id="tbbs" style="display:none">
      <b>Bescheinigung ist erstellt</b>
      <div id="tbub" style="white-space:pre-line;font-size:13px;margin:6px 0"></div>
      <a class="linkres" id="tbdoc" target="_blank" rel="noopener" href="#">📄 Vorschau öffnen (Google Doc)</a>
      <label>An</label><input type="text" id="bsem"><label>Betreff</label><input type="text" id="bsbt">
      <label>Mailtext</label><textarea id="bstx" style="min-height:200px"></textarea>
      <div class="row"><span></span><button class="btn pri" id="bssend" onclick="tbSenden()">Als PDF per Mail senden</button></div>
    </div>
  </div>

  <div id="krwrap" style="display:none">
    <h2 class="ph">Krankmeldung eintragen<button class="x" onclick="panelZu('krwrap')">▲ zuklappen</button></h2>
    <div class="hw">
      <label>Person</label><select id="krp" style="width:100%;font-size:16px;font-family:inherit;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--paper2);color:var(--ink)"><option value="">Liste wird geladen …</option></select>
      <label>Von</label><div style="display:flex;gap:6px"><input type="date" id="krv" style="flex:1"><input type="time" id="krvz" value="08:00" style="width:110px"></div>
      <label>Bis</label><div style="display:flex;gap:6px"><input type="date" id="krb" style="flex:1"><input type="time" id="krbz" value="22:00" style="width:110px"></div>
      <label>Notiz (optional, keine Diagnose)</label><input type="text" id="krn" placeholder="z. B. per Mail gemeldet">
      <div class="row"><span></span><button class="btn pri" id="krbtn" onclick="krSpeichern()">Eintragen</button></div>
    </div>
  </div>

  <div id="hwwrap" style="display:none">
    <h2 class="ph">Hinweise Studierendenportal<button class="x" onclick="panelZu('hwwrap')">▲ zuklappen</button></h2>
    <div id="hwliste"></div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="hwNeu()">+ Hinweis</button>
      <button class="btn pri" id="hwbtn" onclick="hwSpeichern()" style="flex:1">Speichern</button>
    </div>
    <div class="foot" id="hwinfo"></div>
  </div>
  <div class="foot">Neue Befehle werden in <code>BEFEHLE</code> (unten im Quelltext) eingetragen.</div>
</div>
<div id="toast"></div>

<script>
// ── Backend-URLs (identisch zu intern/index.html) ─────────────────
var WEB_APP_URL='https://script.google.com/macros/s/AKfycbyU2DA1drWzq5-K9JNX5EotFNCXUSox_myHjvo6nb4kw9yC3RQ3tZV7_y_hht-kDSJT/exec';
var PDF_WEB_APP_URL='https://script.google.com/macros/s/AKfycbzJm7FzVsFlwmC6plNqsX6zYzJhJJnfgmScpV-g16vAgThSXCBe3ietVQHEthLYCP32tg/exec';
var BACKUP_WEB_APP_URL='https://script.google.com/macros/s/AKfycbx2xyv2s3BMGz12EH8LIcHT_iWuVn4JWnxlw-3NVJ5LjkaCrwQbRckOtJsKov0XepoIWw/exec';

// ── Hilfen ────────────────────────────────────────────────────────
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2800);}
async function getJson(url){var r=await fetch(url);return r.json();}

// ── Login ─────────────────────────────────────────────────────────
function cred(){try{return JSON.parse(localStorage.getItem('hsoIntern_cred')||'null')||{};}catch(e){return {};}}
async function hashStr(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
async function login(){
  var u=$('u').value.trim(),p=$('p').value,e=$('ge'),b=$('gbtn');e.textContent='';
  if(!u||!p){e.textContent='Bitte beides ausfüllen.';return;}
  b.disabled=true;b.textContent='Prüfe …';
  try{
    var h=await hashStr(p);
    var d=await getJson(WEB_APP_URL+'?action=studentLogin&mtknr='+encodeURIComponent(u)+'&pwHash='+encodeURIComponent(h));
    if(d&&d.ok){
      if(d.student&&d.student.erstanmeldung){e.textContent='Erstanmeldung bitte einmal im Voll-Portal abschließen.';}
      else{localStorage.setItem('hsoIntern_cred',JSON.stringify({nutzer:u,pwHash:h}));localStorage.setItem('hsoIntern_authed','1');start();return;}
    }else e.textContent=(d&&d.error)||'Login fehlgeschlagen.';
  }catch(x){e.textContent='Verbindungsfehler.';}
  b.disabled=false;b.textContent='Anmelden';
}
function logout(){localStorage.removeItem('hsoIntern_authed');localStorage.removeItem('hsoIntern_cred');location.reload();}

// ── BEFEHLE: hier weitere Einträge ergänzen ───────────────────────
// run(): async Funktion, gibt {ok:true, text?:'Kurzstatus', url?:'Ergebnis-Link'} zurück oder wirft einen Fehler.
// off:'Grund' sperrt den Button (Backend noch nicht angebunden).
function etappe(url){return getJson(url);}
var BEFEHLE=[
  {gruppe:'Probe & Plan',items:[
    {icon:'📄',titel:'PDF für nächste Probe',sub:'erzeugt den Probenplan als PDF',run:async function(){
      var d=await getJson(PDF_WEB_APP_URL+'?action=pdfNaechste');
      if(!d.ok)throw new Error(d.error||'?');return {ok:true,text:'PDF fertig',url:d.url,urlText:'📄 PDF öffnen'};}},
    {icon:'🗓',titel:'Probenplan sync',sub:'alle Projekt-Docs aktualisieren (ca. 2 Min.)',run:async function(){
      var d=await getJson(WEB_APP_URL+'?action=probenplanSyncJetzt');
      if(!d.ok)throw new Error(d.error||'?');return {ok:true,text:d.fertig?'fertig':'läuft in Etappen weiter'};}},
    {icon:'🔃',titel:'Aktualisieren & veröffentlichen',sub:'Kalender → Portal (ca. 1–2 Min.)',run:async function(){
      var d=await getJson(WEB_APP_URL+'?action=jsonSyncJetzt');
      if(!d.ok)throw new Error(d.error||'?');return {ok:true,text:'veröffentlicht'};}},
    {icon:'⚡',titel:'Alles: sync, veröffentlichen, sync',sub:'der Dreifach-Button (ca. 5 Min.)',run:async function(set){
      set('1/3 Probenplan …');var a=await getJson(WEB_APP_URL+'?action=probenplanSyncJetzt');
      if(!a.ok)throw new Error('1/3: '+(a.error||'?'));if(!a.fertig)return {ok:true,text:'Etappen – später erneut starten'};
      set('2/3 Veröffentlichen …');var b=await getJson(WEB_APP_URL+'?action=jsonSyncJetzt');
      if(!b.ok)throw new Error('2/3: '+(b.error||'?'));
      set('3/3 Probenplan …');var c=await getJson(WEB_APP_URL+'?action=probenplanSyncJetzt');
      if(!c.ok)throw new Error('3/3: '+(c.error||'?'));return {ok:true,text:c.fertig?'alles fertig':'Etappen laufen weiter'};}}
  ]},
  {gruppe:'Studierende',items:[
    {icon:'🤒',titel:'Krankmeldung eintragen',sub:'Person, Zeitraum, Notiz',panel:'krwrap',run:async function(){krOeffnen();return {ok:true,text:'offen · erneut tippen = zu'};}},
    {icon:'📢',titel:'Hinweis auf dem Studierendenportal',sub:'Banner anlegen, ändern, löschen',panel:'hwwrap',run:async function(){hwOeffnen();return {ok:true,text:'offen · erneut tippen = zu'};}}
  ]},
  {gruppe:'HfMT_HSO-Tabelle',items:[
    {icon:'🧾',titel:'Teilnahmebestätigung',sub:'Voranfrage, Bescheinigung, Mailversand',panel:'tbwrap',run:async function(){tbOeffnen();return {ok:true,text:'offen · erneut tippen = zu'};}},
    {icon:'🎻',titel:'Besetzung eintragen (Maske)',sub:'Status und Position in der Einteilung',panel:'bswrap',run:async function(){await bsOeffnen();return {ok:true,text:'offen · erneut tippen = zu'};}}
  ]}
];

// ── Rendering & Ausführung ────────────────────────────────────────
function zeichneBefehle(){
  var h='';
  BEFEHLE.forEach(function(g,gi){
    h+='<h2>'+esc(g.gruppe)+'</h2>';
    g.items.forEach(function(it,ii){
      var id='c_'+gi+'_'+ii;
      h+='<button class="cmd'+(it.off?' off':'')+'" id="'+id+'" onclick="fuehreAus('+gi+','+ii+')">'
        +'<span class="ic">'+it.icon+'</span><span class="tx"><b>'+esc(it.titel)+'</b><small>'+esc(it.sub||'')+'</small></span>'
        +'<span class="st" id="'+id+'_s">'+(it.off?esc(it.off):'')+'</span></button><div id="'+id+'_r"></div>';
    });
  });
  $('liste').innerHTML=h;
}
async function fuehreAus(gi,ii){
  var it=BEFEHLE[gi].items[ii],id='c_'+gi+'_'+ii,b=$(id),s=$(id+'_s'),r=$(id+'_r');
  if(it.off){toast(it.titel+': '+it.off);return;}
  if(b.classList.contains('run'))return;
  if(it.panel&&$(it.panel).style.display==='block'){panelZu(it.panel);return;}
  b.className='cmd run';r.innerHTML='';
  var t0=Date.now();
  var set=function(t){s.innerHTML='<span class="spin"></span>'+esc(t);};
  set('läuft …');
  var iv=setInterval(function(){if(!b.classList.contains('run')){clearInterval(iv);return;}
    if(!set.t)s.innerHTML='<span class="spin"></span>'+Math.round((Date.now()-t0)/1000)+' s';},1000);
  var setX=function(t){set.t=t;set(t);};
  try{
    var res=await it.run(setX);
    b.className='cmd ok';s.textContent='✓ '+(res.text||'fertig');
    if(res.url)r.innerHTML='<a class="linkres" target="_blank" rel="noopener" href="'+esc(res.url)+'">'+esc(res.urlText||'Öffnen')+'</a>';
    toast(it.titel+' ✓');
  }catch(e){
    var m=String(e&&e.message||e);
    if(/auth|berechtigt/i.test(m)){m='Bitte neu anmelden';}
    b.className='cmd err';s.textContent='✗ '+m.slice(0,60);toast('Fehler: '+m);
  }
  clearInterval(iv);
}

// ── Schnittstelle zum Skript "Verwaltung" (Besetzung, Teilnahmebestätigung) ──
var API_URL='https://script.google.com/macros/s/AKfycbymA96R24z5bPQLX85_5e7gk8eaOD2FjDOjT04Uy3_aaBtZRDG7ic4KwXpA3GNQZzLFBA/exec';
function api(action,payload){
  var c=cred();
  return fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({action:action,nutzer:c.nutzer,pwHash:c.pwHash},payload||{}))})
    .then(function(r){return r.json();})
    .then(function(d){if(d&&d.auth){toast('Bitte neu anmelden.');setTimeout(logout,900);}return d;});
}
function fehlerText(d){return (d&&(d.error||d.fehler))||'Unbekannter Fehler';}
function panelZu(id){
  $(id).style.display='none';
  BEFEHLE.forEach(function(g,gi){g.items.forEach(function(it,ii){
    if(it.panel===id){var b=$('c_'+gi+'_'+ii);if(b&&!b.classList.contains('run')){b.className='cmd';$('c_'+gi+'_'+ii+'_s').textContent='';}}
  });});
}
function zeigePanel(id){$(id).style.display='block';$(id).scrollIntoView({behavior:'smooth'});}

// ── Besetzung eintragen ──
var BS=null,BSP={eintraege:{},hatPos:false,posListe:[]},BSSEL=null;
async function bsOeffnen(){
  zeigePanel('bswrap');
  if(BS)return;
  $('bsl').innerHTML='<div class="foot">Lade Personen …</div>';
  try{
    var d=await api('besetzungInit');
    if(!d.ok){toast(fehlerText(d));return;}
    BS=d.data;
    $('bsst').innerHTML='<option value="">– kein Eintrag / leeren –</option>'+BS.statusListe.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
    bsProjekte();
    var ins={};BS.personen.forEach(function(p){if(p.i)ins[p.i]=1;});
    $('bsi').innerHTML='<option value="">alle Instrumente</option>'+Object.keys(ins).sort(function(a,b){return a.localeCompare(b,'de');}).map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
    bsListe();
  }catch(e){toast('Fehler: '+e.message);}
}
function bsProjekte(){
  var alle=$('bsalt').checked,alt=$('bsp').value;
  $('bsp').innerHTML='<option value="">– Projekt wählen –</option>'+BS.projekte.filter(function(p){return alle||!p.alt;}).map(function(p){return '<option>'+esc(p.name)+'</option>';}).join('');
  if(alt)$('bsp').value=alt;
}
async function bsLadeProjekt(){
  var pr=$('bsp').value;
  if(!pr){BSP={eintraege:{},hatPos:false,posListe:[]};bsListe();bsKarte();return;}
  try{
    var d=await api('besetzungProjekt',{projekt:pr});
    if(!d.ok){toast(fehlerText(d));return;}
    BSP=d.data;
    $('bsposl').innerHTML=(BSP.posListe||[]).map(function(x){return '<option value="'+esc(x)+'">';}).join('');
    bsListe();bsKarte();
  }catch(e){toast('Fehler: '+e.message);}
}
function bsMark(p){var e=BSP.eintraege[p.z];if(!e)return '';var t=e[0]||'';if(e[1])t+=(t?', ':'')+e[1];return t?' → '+t:'';}
function bsListe(){
  if(!BS)return;
  var ins=$('bsi').value,q=$('bsq').value.trim().toLowerCase();
  var l=BS.personen.filter(function(p){return (!ins||p.i===ins)&&(!q||p.n.toLowerCase().indexOf(q)>=0);}).sort(function(a,b){return a.n.localeCompare(b.n,'de');});
  $('bsz').textContent='('+l.length+' von '+BS.personen.length+')';
  $('bsl').innerHTML=l.slice(0,80).map(function(p){
    return '<button class="'+(BSSEL&&BSSEL.z===p.z?'on':'')+'" onclick="bsWaehle('+p.z+')">'+esc(p.n)+' <small>'+esc(p.i)+esc(bsMark(p))+'</small></button>';
  }).join('')+(l.length>80?'<div class="foot">Weitere mit Suche eingrenzen …</div>':'');
}
function bsWaehle(z){BSSEL=BS.personen.filter(function(p){return p.z===z;})[0]||null;bsListe();bsKarte();}
function bsKarte(){
  var p=BSSEL;
  if(!p){$('bskarte').style.display='none';return;}
  $('bskarte').style.display='block';
  $('bskn').textContent=p.n+(p.m?' ('+p.m+')':'');
  $('bski').textContent=[p.i,p.a,p.f?('FS '+p.f):'',p.t?('Projekte gesamt: '+p.t):''].filter(Boolean).join(' · ');
  var e=BSP.eintraege[p.z]||['',''];
  $('bsst').value=e[0]||'';if($('bsst').value!==(e[0]||''))$('bsst').value='';
  $('bspos').value=e[1]||'';
  $('bspw').style.display=BSP.hatPos?'':'none';
  $('bssave').disabled=!$('bsp').value;
}
async function bsSpeichern(){
  var pr=$('bsp').value,p=BSSEL;
  if(!pr){toast('Bitte oben ein Projekt wählen.');return;}
  if(!p)return;
  var st=$('bsst').value,pos=BSP.hatPos?$('bspos').value.trim():'';
  var mail=$('bsmail').checked?{anrede:$('bsan').value}:null;
  if(mail&&!st){toast('Für die Bestätigungsmail bitte einen Status wählen.');return;}
  var b=$('bssave');b.disabled=true;
  try{
    var d=await api('besetzungSpeichern',{projekt:pr,zeile:p.z,name:p.n,status:st,pos:pos,mail:mail});
    if(!d.ok){toast(fehlerText(d));}
    else{
      if(st||pos)BSP.eintraege[p.z]=[st,pos];else delete BSP.eintraege[p.z];
      if(d.gesamt!==undefined&&d.gesamt!==''){p.t=d.gesamt;}
      var m='Gespeichert: '+p.n+' → '+(st||'(leer)')+(pos?', '+pos:'');
      if(d.mail){m+=d.mail.gesendet?' – Mail gesendet':' – Mail NICHT gesendet: '+d.mail.fehler;if(d.mail.gesendet)$('bsmail').checked=false;}
      toast(m);bsListe();bsKarte();
    }
  }catch(e){toast('Fehler: '+e.message);}
  b.disabled=false;
}
async function bsPortal(){
  var pr=$('bsp').value;
  if(!pr){toast('Bitte oben zuerst ein Projekt wählen.');return;}
  toast('Aktualisiere die Teilnehmerliste im Portal …');
  try{
    var d=await getJson(WEB_APP_URL+'?action=teilnehmerSync&spalte='+encodeURIComponent(pr));
    toast(d&&d.ok?'Im Portal aktualisiert: '+d.projekt:fehlerText(d));
  }catch(e){toast('Fehler: '+e.message);}
}

// ── Teilnahmebestätigung ──
var TBP=null,TBDOC=null,TBVA={vorname:'',text:''},TBSEM=null;
function tbOeffnen(){zeigePanel('tbwrap');}
async function tbSuchen(){
  var q=$('tbq').value.trim();
  if(!q){toast('Bitte einen Namen eingeben.');return;}
  try{
    var d=await api('tbSuche',{query:q});
    if(!d.ok){toast(fehlerText(d));return;}
    var l=d.data||[];$('tbl').style.display='block';
    $('tbl').innerHTML=l.length?l.map(function(p,i){return '<button onclick="tbWaehle('+i+')">'+esc(p.vorname+' '+p.nachname)+' <small>'+esc(p.mtknr)+'</small></button>';}).join(''):'<div class="foot">Keine Treffer. Unten manuell eingeben.</div>';
    window._tbTreffer=l;
  }catch(e){toast('Fehler: '+e.message);}
}
function tbWaehle(i){TBP=window._tbTreffer[i];$('tbsel').textContent='Gewählt: '+TBP.vorname+' '+TBP.nachname;$('tbman').checked=false;$('tbmp').style.display='none';$('tbl').style.display='none';}
function tbPayload(){
  var sem=[];
  if($('tbsm').checked)document.querySelectorAll('#tbsemw input:checked').forEach(function(cb){sem.push(cb.value);});
  var man=$('tbman').checked;
  return {zeile:man?null:(TBP&&TBP.zeile),vorname:$('tbvn').value.trim(),nachname:$('tbnn').value.trim(),email:$('tbem').value.trim(),
    modusManuell:$('tbsm').checked,manuelleSemester:sem,manuelleWeitere:$('tbwp').value};
}
function tbPruefePerson(){
  if($('tbman').checked){if(!$('tbvn').value.trim()&&!$('tbnn').value.trim()){toast('Bitte Vor- und Nachname angeben.');return false;}return true;}
  if(!TBP){toast('Bitte zuerst eine Person suchen und wählen.');return false;}
  return true;
}
async function tbVoranfrage(){
  if(!tbPruefePerson())return;
  var b=$('tbvab');b.disabled=true;b.textContent='Lade …';
  try{
    var d=await api('tbVoranfrageDaten',tbPayload());
    if(!d.ok){toast(fehlerText(d));}
    else{TBVA={vorname:d.vorname,text:d.uebersicht};$('vaem').value=d.email||'';$('vabt').value='Teilnahmebestätigung HfMT – bitte Projekte prüfen';$('tbva').style.display='block';tbVaText();$('tbva').scrollIntoView({behavior:'smooth'});}
  }catch(e){toast('Fehler: '+e.message);}
  b.disabled=false;b.textContent='1. Voranfrage';
}
function tbVaText(){
  var NL='\n';
  $('vatx').value=$('vaan').value+' '+TBVA.vorname+','+NL+NL
   +'vielen Dank für Ihre Anfrage. Damit die Teilnahmebestätigung vollständig ist, habe ich zuerst die Projekte sowie die Blattspiel- und Repertoireproben zusammengestellt, die bei mir für Sie erfasst sind:'+NL+NL
   +TBVA.text+NL+NL
   +'Sind damit alle Projekte und Proben erfasst, für die Sie eine Bestätigung brauchen? Falls etwas fehlt, schreiben Sie mir bitte kurz, was (mit Semester) noch fehlt.'+NL+NL
   +'Diese Bestätigung von mir reicht aus. Die gelben Zettel müssen nicht alle einzeln von mir handschriftlich unterschrieben werden.'+NL+NL
   +'Viele Grüße'+NL+'Thomas Dorsch';
}
async function tbVaSenden(){
  var em=$('vaem').value.trim();
  if(!em){toast('Keine E-Mail-Adresse angegeben.');return;}
  if(!confirm('Voranfrage an '+em+' senden?'))return;
  var b=$('vasend');b.disabled=true;
  try{var d=await api('tbVoranfrageSenden',{email:em,betreff:$('vabt').value.trim(),mailtext:$('vatx').value});toast(d.ok?'Voranfrage gesendet ✓':fehlerText(d));}
  catch(e){toast('Fehler: '+e.message);}
  b.disabled=false;
}
async function tbErstellen(){
  if(!tbPruefePerson())return;
  var b=$('tbeb');b.disabled=true;b.textContent='Erstelle …';
  try{
    var d=await api('tbErstellen',tbPayload());
    if(!d.ok){toast(fehlerText(d));}
    else{
      TBDOC=d.docId;
      $('tbub').textContent=d.uebersicht||'';$('tbdoc').href=d.docUrl;
      $('bsem').value=d.email||'';$('bsbt').value='Bescheinigung über eine Teilnahme – HfMT Hamburg';
      $('bstx').value='Liebe/r Studierende/r,\n\nanbei erhalten Sie Ihre Bescheinigung über die Teilnahme an den Projekten und an den Blattspiel- und Repertoireproben des Hochschulorchesters. Sie enthält folgende Angaben:\n\n'+(d.uebersicht||'')+'\n\nMit freundlichen Grüßen\nThomas Dorsch';
      $('tbbs').style.display='block';$('tbbs').scrollIntoView({behavior:'smooth'});
    }
  }catch(e){toast('Fehler: '+e.message);}
  b.disabled=false;b.textContent='2. Bescheinigung erstellen';
}
async function tbSenden(){
  var em=$('bsem').value.trim();
  if(!TBDOC){toast('Zuerst die Bescheinigung erstellen.');return;}
  if(!em){toast('Keine E-Mail-Adresse angegeben.');return;}
  if(!confirm('Bescheinigung als PDF an '+em+' senden?'))return;
  var b=$('bssend');b.disabled=true;
  try{var d=await api('tbSenden',{docId:TBDOC,email:em,betreff:$('bsbt').value.trim(),mailtext:$('bstx').value});toast(d.ok?'Bescheinigung gesendet ✓':fehlerText(d));}
  catch(e){toast('Fehler: '+e.message);}
  b.disabled=false;
}
async function tbSemesterLaden(){
  if(TBSEM)return;
  var d=await api('tbSemester');
  if(d.ok){TBSEM=d.data;$('tbsemw').innerHTML='<div class="semg">'+TBSEM.map(function(x){return '<label><input type="checkbox" value="'+esc(x)+'"> '+esc(x)+'</label>';}).join('')+'</div>';}
}
function verdrahte(){
  $('bsp').onchange=bsLadeProjekt;$('bsalt').onchange=bsProjekte;$('bsi').onchange=bsListe;$('bsq').oninput=bsListe;
  $('bsmail').onchange=function(){$('bsmo').style.display=this.checked?'':'none';};
  $('tbman').onchange=function(){$('tbmp').style.display=this.checked?'':'none';};
  $('tbsm').onchange=function(){$('tbsemw').style.display=this.checked?'':'none';if(this.checked)tbSemesterLaden();};
  $('tbq').onkeydown=function(e){if(e.key==='Enter')tbSuchen();};
}

// ── Krankmeldung (gleiche Backend-Aktion wie Voll-Portal: krankmeldungSpeichern) ──
var STUD=null;
function post(payload){return fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify(Object.assign({},cred(),payload))}).then(function(r){return r.json();}).then(function(d){if(d&&d.auth){logout();}return d;});}
function isoHeute(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function deDatum(iso){var p=(iso||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:'';}
async function krOeffnen(){
  $('krwrap').style.display='block';$('krwrap').scrollIntoView({behavior:'smooth'});
  if(!$('krv').value){$('krv').value=isoHeute();$('krb').value=isoHeute();}
  if(STUD)return;
  try{
    var c=cred();var d=await getJson(WEB_APP_URL+'?action=studierendenListe&nutzer='+encodeURIComponent(c.nutzer||'')+'&pwHash='+encodeURIComponent(c.pwHash||''));
    if(d&&d.auth){logout();return;}
    if(!d.ok)throw new Error(d.error||'Liste nicht verfügbar');
    STUD=d.data||[];
    $('krp').innerHTML='<option value="">Person wählen …</option>'+STUD.map(function(st){return '<option value="'+esc(st.mtknr)+'">'+esc(st.name)+(st.instrument?' · '+esc(st.instrument):'')+'</option>';}).join('');
  }catch(e){toast('Studierendenliste: '+e.message);}
}
async function krSpeichern(){
  var st=(STUD||[]).find(function(x){return String(x.mtknr)===$('krp').value;});
  if(!st){toast('Bitte eine Person wählen');return;}
  if(!$('krv').value||!$('krb').value){toast('Bitte Datum angeben');return;}
  if($('krb').value<$('krv').value){toast('„Bis“ liegt vor „Von“');return;}
  var b=$('krbtn');b.disabled=true;
  try{
    var d=await post({action:'krankmeldungSpeichern',mtknr:st.mtknr,name:st.name,gesehenVon:'Thomas Dorsch',
      datumVon:deDatum($('krv').value),uhrzeitVon:$('krvz').value||'08:00',datumBis:deDatum($('krb').value),uhrzeitBis:$('krbz').value||'22:00',notiz:$('krn').value.trim()});
    if(!d.ok){toast('Fehler: '+(d.error||'?'));}
    else{toast('✓ Krankmeldung für '+st.name+' eingetragen');$('krn').value='';$('krp').value='';}
  }catch(e){toast('Fehler: '+e.message);}
  b.disabled=false;
}

// ── Hinweise (hinweis.json im Repo; GitHub-Token wie im Voll-Portal) ──
var HW=[];
function hwOeffnen(){$('hwwrap').style.display='block';$('hwwrap').scrollIntoView({behavior:'smooth'});if(!HW.length)hwLaden();}
function hwZeichnen(){
  $('hwliste').innerHTML=HW.length?HW.map(function(h,i){
    return '<div class="hw" data-i="'+i+'">'
     +'<label>Titel</label><input type="text" class="t" value="'+esc(h.titel)+'">'
     +'<label>Text</label><textarea class="x">'+esc(h.text)+'</textarea>'
     +'<label>Sichtbar bis (leer = bleibt)</label><input type="date" class="b" value="'+esc(h.bis)+'">'
     +'<div class="row"><label style="margin:0"><input type="checkbox" class="a"'+(h.aktiv?' checked':'')+'> angezeigt</label>'
     +'<button class="btn" onclick="hwLoeschen('+i+')">Löschen</button></div></div>';
  }).join(''):'<div class="foot">Keine Hinweise. Mit „+ Hinweis“ einen anlegen.</div>';
}
function hwLesen(){
  var out=[];document.querySelectorAll('#hwliste .hw').forEach(function(el){
    out.push({aktiv:el.querySelector('.a').checked,titel:el.querySelector('.t').value.trim()||'Achtung',text:el.querySelector('.x').value.trim(),bis:el.querySelector('.b').value});});
  return out;
}
function hwNeu(){HW=hwLesen();HW.push({aktiv:true,titel:'Achtung',text:'',bis:''});hwZeichnen();}
function hwLoeschen(i){HW=hwLesen();HW.splice(i,1);hwZeichnen();}
async function hwLaden(){
  try{var r=await fetch('../hinweis.json?t='+Date.now(),{cache:'no-store'});var j=await r.json();
    HW=(Array.isArray(j.hinweise)?j.hinweise:(j&&j.text?[j]:[])).map(function(h){return {aktiv:h.aktiv!==false,titel:h.titel||'Achtung',text:h.text||'',bis:h.bis||''};});
  }catch(e){HW=[];}
  hwZeichnen();
}
async function hwSpeichern(){
  var tok=localStorage.getItem('mlGithubToken');
  if(!tok){toast('GitHub-Token fehlt: einmal im Voll-Portal unter „Meine Links“ hinterlegen.');return;}
  HW=hwLesen();
  if(HW.some(function(h){return h.aktiv&&!h.text;})){toast('Bitte bei jedem angezeigten Hinweis einen Text eingeben.');return;}
  HW.sort(function(a,b){return (a.bis||'9999').localeCompare(b.bis||'9999');});hwZeichnen();
  var api='https://api.github.com/repos/hfmt-hso/hfmt-hso.github.io/contents/hinweis.json';
  var hd={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json'},btn=$('hwbtn');btn.disabled=true;
  try{
    var g=await fetch(api+'?ref=main&t='+Date.now(),{headers:hd});var sha=g.ok?(await g.json()).sha:undefined;
    var body={message:'Hinweise aktualisiert ('+HW.length+') [mobil]',content:btoa(unescape(encodeURIComponent(JSON.stringify({hinweise:HW},null,2)+'\n'))),branch:'main'};
    if(sha)body.sha=sha;
    var p=await fetch(api,{method:'PUT',headers:hd,body:JSON.stringify(body)});
    if(!p.ok)throw new Error('HTTP '+p.status);
    toast('Hinweise gespeichert ✓ (nach 1–2 Min. im Portal)');$('hwinfo').textContent='Zuletzt gespeichert: '+new Date().toLocaleTimeString('de-DE');
  }catch(e){toast('Fehler: '+e.message);}
  btn.disabled=false;
}

// ── Start ─────────────────────────────────────────────────────────
function start(){$('gate').style.display='none';$('app').style.display='block';zeichneBefehle();verdrahte();}
if(localStorage.getItem('hsoIntern_authed')==='1'&&cred().pwHash){start();}else{$('gate').style.display='block';}
</script>
