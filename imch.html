<!DOCTYPE html> <html lang="de"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#185FA5"> <meta name="robots" content="noindex"> <title>IMCH – Zeitplan</title> <link rel="icon" href="https://hfmt-hso.github.io/icon-192.png"> <style> *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} :root{ --blue:#185FA5;--blue-light:#E6F1FB; --amber:#854F0B;--amber-light:#FAEEDA; --gray:#5F5E5A;--gray-light:#F1EFE8; --text:#1a1a1a;--text-muted:#6b6b6b; --border:rgba(0,0,0,0.1); --bg:#f5f5f3;--card-bg:#fff; --header-bg:#fff; } @media(prefers-color-scheme:dark){:root{ --text:#f0f0ee;--text-muted:#999997; --border:rgba(255,255,255,0.1); --bg:#1a1a18;--card-bg:#2a2a28; --header-bg:#222220; }} body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:640px;margin:0 auto} .header{background:var(--header-bg);padding:12px 16px;border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:10} .header-row{display:flex;align-items:center;justify-content:space-between} .header-left{display:flex;align-items:center;gap:10px} .header-logo{height:44px;width:auto;flex-shrink:0;border-radius:8px} .header-text h1{font-size:16px;font-weight:600;color:var(--text)} .header-text p{font-size:11px;color:var(--text-muted);margin-top:1px} .refresh-btn{font-size:11px;padding:6px 12px;border-radius:20px;font-weight:600;background:var(--blue-light);color:var(--blue);border:none;cursor:pointer;font-family:inherit} .refresh-btn:active{opacity:.7} .content{padding:14px;padding-bottom:40px} .hint-card{background:var(--blue-light);color:var(--blue);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:14px} .status-line{font-size:11px;color:var(--text-muted);margin-bottom:14px;text-align:center} .loading{text-align:center;padding:24px;color:var(--text-muted);font-size:13px} .error-card{background:var(--amber-light);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.5}  .day-card{background:var(--card-bg);border-radius:14px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:14px} .day-head{padding:12px 14px;font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-light)} .day-body{padding:6px 14px 10px}  .block{margin-top:12px} .block:first-child{margin-top:8px} .block-room{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;padding-bottom:6px;border-bottom:0.5px solid var(--border)}  table.plan{width:100%;border-collapse:collapse} table.plan tr.row td{font-size:13px;color:var(--text);padding:6px 4px;vertical-align:top;border-bottom:0.5px solid var(--border)} table.plan tr.row:last-child td{border-bottom:none} table.plan td.zeit{white-space:nowrap;font-weight:600;color:var(--text);width:88px} table.plan td.wer{color:var(--text-muted);text-align:right;white-space:nowrap;padding-left:8px} table.plan td.prog .solist{color:var(--text-muted)} tr.pause td{font-size:11px;color:var(--text-muted);font-style:italic;text-align:center;padding:5px 4px;border-bottom:0.5px dashed var(--border)} </style> </head> <body>  <div class="header"> <div class="header-row"> <div class="header-left"> <img class="header-logo" src="https://hfmt-hso.github.io/icon-192.png" alt="HfMT"> <div class="header-text"> <h1>IMCH – Zeitplan</h1> <p>International Masterclass for Conductors Hamburg &amp; Halle</p> </div> </div> <button class="refresh-btn" onclick="ladePlan()">↻ Aktualisieren</button> </div> </div>  <div class="content"> <div class="hint-card">Dieser Zeitplan wird direkt aus der Arbeitsplan-Tabelle geladen. Änderungen dort erscheinen hier nach dem Neuladen der Seite automatisch.</div> <div class="status-line" id="status-line"></div> <div id="plan-liste"><div class="loading">Zeitplan wird geladen…</div></div> </div>  <script> const SHEET_ID = '1wttn42IXM10-UNIom0pGPolfSvIR2Bekbkcd6QsVcB8'; const SHEET_NAME = 'Arbeitsplan 2026'; const CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(SHEET_NAME); const WT = ['So','Mo','Di','Mi','Do','Fr','Sa'];  function esc(s){ return String(s == null ? '' : s) .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }  /* Robuster CSV-Parser (behandelt Anfuehrungszeichen, Kommas und Zeilenumbrueche innerhalb von Feldern) */ function parseCsv(text){ const rows = []; let row = [], field = '', inQuotes = false; for(let i = 0; i < text.length; i++){ const c = text[i]; if(inQuotes){ if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } } else { field += c; } } else { if(c === '"'){ inQuotes = true; } else if(c === ','){ row.push(field); field = ''; } else if(c === '\r'){ /* ignorieren */ } else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; } else { field += c; } } } if(field.length || row.length){ row.push(field); rows.push(row); } return rows; }  /* Versucht, ein deutsches Wochentagskuerzel vor ein erkanntes Datum zu setzen (dd.mm.yyyy). */ function formatiereTag(roh){ const s = String(roh || '').trim(); if(!s) return s; const m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(m){ const d = new Date(+m[3], +m[2]-1, +m[1]); if(!isNaN(d.getTime())) return WT[d.getDay()] + ' ' + s; } return s; }  function baueBlock(rows){ let html = '<table class="plan">'; rows.forEach(r => { const zeit = esc(r.zeit); if(/^pause$/i.test(r.programm.trim())){ html += '<tr class="pause"><td colspan="2">' + (zeit ? zeit + ' – ' : '') + 'Pause</td></tr>'; return; } let prog = esc(r.programm); if(r.solist) prog += '<div class="solist">' + esc(r.solist) + '</div>'; const wer = esc(r.teilnehmer); html += '<tr class="row"><td class="zeit">' + zeit + '</td><td class="prog">' + prog + '</td><td class="wer">' + wer + '</td></tr>'; }); html += '</table>'; return html; }  function baueTag(datum, bloecke){ let html = '<div class="day-card"><div class="day-head">' + esc(formatiereTag(datum)) + '</div><div class="day-body">'; bloecke.forEach(b => { html += '<div class="block">'; if(b.raum) html += '<div class="block-room">' + esc(b.raum) + '</div>'; html += baueBlock(b.rows); html += '</div>'; }); html += '</div></div>'; return html; }  function rendere(rows){ /* Gruppieren: neuer Tag bei Datumswechsel, neuer Block bei Raumwechsel innerhalb eines Tages */ const tage = []; let aktTag = null, aktBlock = null; rows.forEach(r => { if(!r.datum && !r.zeit && !r.programm && !r.teilnehmer) return; /* leere Trennzeile */ if(!aktTag || aktTag.datum !== r.datum){ aktTag = {datum: r.datum, bloecke: []}; tage.push(aktTag); aktBlock = null; } const raum = r.raum || (aktBlock ? aktBlock.raum : ''); if(!aktBlock || aktBlock.raum !== raum){ aktBlock = {raum: raum, rows: []}; aktTag.bloecke.push(aktBlock); } aktBlock.rows.push(r); });  const liste = document.getElementById('plan-liste'); if(!tage.length){ liste.innerHTML = '<div class="error-card">Keine Termine gefunden.</div>'; return; } liste.innerHTML = tage.map(t => baueTag(t.datum, t.bloecke)).join(''); }  function ladePlan(){ document.getElementById('plan-liste').innerHTML = '<div class="loading">Zeitplan wird geladen…</div>'; document.getElementById('status-line').textContent = ''; fetch(CSV_URL, {cache: 'no-store'}) .then(res => { if(!res.ok) throw new Error('HTTP ' + res.status); return res.text(); }) .then(text => { const table = parseCsv(text).filter(r => r.length > 1 || (r[0] || '').trim() !== ''); if(!table.length) throw new Error('Leere Antwort'); const rows = table.slice(1).map(r => ({ datum: (r[0] || '').trim(), zeit: (r[1] || '').trim(), raum: (r[2] || '').trim(), programm: (r[3] || '').trim(), solist: (r[4] || '').trim(), teilnehmer: (r[5] || '').trim() })); rendere(rows); const jetzt = new Date(); document.getElementById('status-line').textContent = 'Zuletzt aktualisiert: ' + jetzt.toLocaleString('de-DE'); }) .catch(err => { document.getElementById('plan-liste').innerHTML = '<div class="error-card">Zeitplan konnte nicht geladen werden (' + esc(err.message) + '). Bitte Seite neu laden.</div>'; }); }  ladePlan(); </script> </body> </html>
