<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werkverzeichnis · Thomas Dorsch</title>
<style>
  :root{
    --bg:#f5f5f3;
    --card:#ffffff;
    --border:rgba(0,0,0,0.1);
    --text:#1c1c1e;
    --muted:#6b6b70;
    --blue:#185fa5;
    --blue-bg:#eaf1fb;
    --green-bg:#eaf3de;
    --green-text:#3b6d11;
    --amber-bg:#fbeedc;
    --amber-text:#96631a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:-apple-system,"system-ui","Segoe UI",sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .header{
    background:var(--card);
    border:0.5px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .header .titles{display:flex;align-items:center;gap:12px;}
  .header .icon{
    width:40px;height:40px;border-radius:11px;
    background:var(--blue-bg);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    flex-shrink:0;
  }
  .header h1{font-size:16px;margin:0;font-weight:700;}
  .header p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
  .pill{
    background:var(--green-bg);
    color:var(--green-text);
    font-size:11px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .toolbar{
    background:var(--card);
    border:0.5px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:14px;
  }
  .search-input{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#f7f7f6;
    font-size:15px;
    font-family:inherit;
    color:var(--text);
    outline:none;
  }
  .search-input:focus{border-color:var(--blue);background:#fff;}
  .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .chip{
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:#f7f7f6;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
    user-select:none;
    transition:background .12s,color .12s,border-color .12s;
  }
  .chip.active-komposition{background:var(--amber-bg);color:var(--amber-text);border-color:transparent;}
  .chip.active-arrangement{background:var(--blue-bg);color:var(--blue);border-color:transparent;}
  .actions{display:flex;gap:8px;margin-top:12px;}
  .btn{
    flex:1;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#f7f7f6;
    font-size:13px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:hover{background:#efefee;}
  .btn:active{transform:scale(0.98);}
  .section-label{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:18px 4px 8px;
  }
  .list{display:flex;flex-direction:column;gap:8px;}
  .card{
    background:var(--card);
    border:0.5px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card .werk{font-size:15px;font-weight:700;line-height:1.3;}
  .card .titel{font-size:13px;color:var(--muted);margin-top:1px;}
  .card .komponist{font-size:13.5px;color:var(--muted);margin-top:4px;}
  .badge{
    font-size:10.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .badge.komposition{background:var(--amber-bg);color:var(--amber-text);}
  .badge.arrangement{background:var(--blue-bg);color:var(--blue);}
  .meta{display:flex;gap:14px;margin-top:9px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .meta span b{color:var(--text);font-weight:600;}
  .besetzung{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:14px;
  }
  .toast{
    position:fixed;
    bottom:24px;left:50%;
    transform:translateX(-50%);
    background:#1c1c1e;
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:99;
  }
  .toast.show{opacity:1;}
  .footer-note{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    margin-top:20px;
  }

  @media print{
    body{background:#fff;}
    .toolbar,.footer-note,.toast,.header .icon{display:none;}
    .header{border:none;padding:0 0 10px;}
    .wrap{max-width:100%;padding:0;}
    .card{border:none;border-bottom:1px solid #ddd;border-radius:0;padding:8px 0;page-break-inside:avoid;}
    .list{gap:0;}
    .section-label{display:none;}
    a{color:inherit;text-decoration:none;}
  }
</style>
</head>

<div class="wrap">

  <div class="header">
    <div class="titles">
      <div class="icon">🎼</div>

      </div>
    </div>
    <div class="pill" id="countPill">0</div>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Suche nach Komponist, Titel, Werk …">
    <div class="chips">
      <div class="chip" id="chipKomposition" data-active="1">Eigene Komposition</div>
      <div class="chip" id="chipArrangement" data-active="1">Eigenes Arrangement</div>
    </div>
    <div class="actions">
      <button class="btn" id="copyBtn">📋 In Zwischenablage kopieren</button>
      <button class="btn" id="pdfBtn">🖨️ Als PDF exportieren</button>
    </div>
  </div>

  <div class="section-label" id="resultsLabel">Ergebnisse</div>
  <div class="list" id="list"></div>
  <div class="empty" id="emptyState" style="display:none;">Keine Werke gefunden.</div>

  <div class="footer-note">Werkverzeichnis von Thomas Dorsch · zum internen Gebrauch</div>
</div>

<div class="toast" id="toast"></div>

const searchInput = document.getElementById('searchInput');
const chipK = document.getElementById('chipKomposition');
const chipA = document.getElementById('chipArrangement');
const listEl = document.getElementById('list');
const emptyState = document.getElementById('emptyState');
const countPill = document.getElementById('countPill');
const resultsLabel = document.getElementById('resultsLabel');
const toast = document.getElementById('toast');

let state = {
  query: '',
  showKomposition: true,
  showArrangement: true
};

function norm(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'');
}

function matches(item){
  const wantK = state.showKomposition;
  const wantA = state.showArrangement;
  if(item.gattung === 'Eigene Komposition' && !wantK) return false;
  if(item.gattung === 'Eigenes Arrangement' && !wantA) return false;
  if(!state.query) return true;
  const q = norm(state.query);
  const haystack = norm([item.vorname,item.name,item.werk,item.titel].join(' '));
  return haystack.includes(q);
}

function currentResults(){
  return DATA.filter(matches);
}

function escapeHtml(s){
  return (s||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const results = currentResults();
  countPill.textContent = results.length;
  resultsLabel.textContent = 'Ergebnisse (' + results.length + ')';

  if(results.length === 0){
    listEl.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  listEl.innerHTML = results.map(item => {
    const isK = item.gattung === 'Eigene Komposition';
    const badgeClass = isK ? 'komposition' : 'arrangement';
    const badgeLabel = isK ? 'Komposition' : 'Arrangement';
    const komponist = [item.vorname, item.name].filter(Boolean).join(' ');
    const metaBits = [];
    if(item.dauer) metaBits.push('<span><b>Dauer:</b> ' + escapeHtml(item.dauer) + '</span>');
    if(item.nummer) metaBits.push('<span><b>Nr.:</b> ' + escapeHtml(item.nummer) + '</span>');
    return '<div class="card">' +
      '<div class="top">' +
        '<div>' +
          '<div class="werk">' + escapeHtml(item.werk || '(ohne Titel)') + '</div>' +
          (item.titel ? '<div class="titel">' + escapeHtml(item.titel) + '</div>' : '') +
          '<div class="komponist">' + escapeHtml(komponist || '—') + '</div>' +
        '</div>' +
        '<div class="badge ' + badgeClass + '">' + badgeLabel + '</div>' +
      '</div>' +
      (metaBits.length ? '<div class="meta">' + metaBits.join('') + '</div>' : '') +
      (item.besetzung ? '<div class="besetzung">' + escapeHtml(item.besetzung) + '</div>' : '') +
    '</div>';
  }).join('');
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1800);
}

searchInput.addEventListener('input', e => {
  state.query = e.target.value;
  render();
});

chipK.addEventListener('click', () => {
  state.showKomposition = !state.showKomposition;
  chipK.dataset.active = state.showKomposition ? '1':'0';
  chipK.classList.toggle('active-komposition', state.showKomposition);
  render();
});
chipA.addEventListener('click', () => {
  state.showArrangement = !state.showArrangement;
  chipA.dataset.active = state.showArrangement ? '1':'0';
  chipA.classList.toggle('active-arrangement', state.showArrangement);
  render();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const results = currentResults();
  if(results.length === 0){ showToast('Keine Ergebnisse zum Kopieren.'); return; }
  const lines = results.map(item => {
    const komponist = [item.vorname, item.name].filter(Boolean).join(' ');
    const parts = [
      komponist || '—',
      item.werk || '',
      item.titel || '',
      item.dauer || '',
      item.besetzung || ''
    ];
    return parts.join('\t');
  });
  const header = ['Komponist','Werk','Titel','Dauer','Besetzung'].join('\t');
  const text = header + '\n' + lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast(results.length + ' Werke in Zwischenablage kopiert.');
  }).catch(() => {
    showToast('Kopieren nicht möglich.');
  });
});

document.getElementById('pdfBtn').addEventListener('click', () => {
  window.print();
});

// init chip visuals
chipK.classList.add('active-komposition');
chipA.classList.add('active-arrangement');
render();
</script>
